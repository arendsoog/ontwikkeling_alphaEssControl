name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must match what the pinned pytest-homeassistant-custom-component
          # (requirements-test.txt) requires -- Home Assistant 2026.3+ needs 3.14.
          python-version: "3.14"
          cache: "pip"
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: pytest --cov=custom_components.alpha_ess_local tests

  # hacs-validate (hacs/action) removed: its "brands" check requires
  # submitting artwork to the external home-assistant/brands repo and
  # getting it approved there, which only matters for listing in the
  # official HACS store -- not needed to install this as a HACS custom
  # repository. Left permanently failing, it also silently blocked
  # release.yaml (which only runs after a fully successful CI run).

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

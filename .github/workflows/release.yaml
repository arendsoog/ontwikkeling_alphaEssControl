name: Release

on:
  workflow_dispatch:

jobs:
  release:
    # Manual only. This used to auto-run after every CI success on master
    # and bump+push a version commit straight to master, but master's
    # ruleset blocks direct pushes even from GITHUB_TOKEN (rulesets can't
    # be bypassed by the default token, by GitHub design), so that step
    # always failed once the ruleset was added. Bump manifest.json's
    # version first with the "Bump Version" workflow + a normal PR, then
    # run this to tag + publish a release for that version.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          set -e
          version=$(jq -r '.version' custom_components/alpha_ess_local/manifest.json)
          git fetch --tags --quiet
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already tagged -- bump manifest.json's version (via the Bump Version workflow + a PR) first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
